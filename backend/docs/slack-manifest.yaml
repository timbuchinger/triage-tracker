display_information:
  name: "Triage Tracker"
  description: "Slack integration for Triage Tracker — incident creation, channel management, and message highlighting."
  background_color: "#36C5F0"

features:
  bot_user:
    display_name: "TriageBot"
    always_online: false

  slash_commands:
    - command: "/inc"
      description: "Open the incident creation modal or create an incident"
      usage_hint: "[title]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - channels:read
      - channels:history
      - channels:write
      - conversations:write
      - users:read
      - reactions:read
    user:
      - identity.basic
      - identity.email
      - identity.avatar
  redirect_urls:
    - "https://caperingly-equiangular-maurine.ngrok-free.dev/api/integrations/slack/callback"

settings:
  event_subscriptions:
    request_url: "https://caperingly-equiangular-maurine.ngrok-free.dev/api/integrations/slack/events"
    bot_events:
      - reaction_added
      - app_uninstalled
      - message.channels

  interactivity:
    is_enabled: true
    request_url: "https://caperingly-equiangular-maurine.ngrok-free.dev/api/integrations/slack/interactions"

  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false

metadata:
  # Notes for maintainers: Replace the ngrok URL with your deployment base URL (example: https://triage.example.com)
  instructions: |
    - Set the `redirect_urls` value to your app's OAuth callback endpoint: `{BASE_URL}/api/integrations/slack/callback`.
    - Set the `request_url` values to your runtime endpoints that the backend exposes:
      - Slash command: `{BASE_URL}/api/integrations/slack/commands/inc`
      - Interactivity: `{BASE_URL}/api/integrations/slack/interactions`
      - Events: `{BASE_URL}/api/integrations/slack/events`
    - The manifest requests the following scopes:
      - Bot scopes: `commands`, `chat:write`, `chat:write.public`, `channels:read`, `channels:history`, `channels:write`, `conversations:write`, `users:read`, `reactions:read`
      - User scopes: `identity.basic`, `identity.email`, `identity.avatar` (for linking individual user accounts)
    - After importing this manifest into Slack, confirm the following event subscriptions are enabled: `reaction_added`, `app_uninstalled`, and (optionally) `message.channels` if you want message events.
    - For local development with ngrok, update all URLs to use your ngrok URL and ensure SLACK_REDIRECT_URI in backend/.env matches the redirect_urls value.
