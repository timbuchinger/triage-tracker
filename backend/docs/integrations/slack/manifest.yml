display_information:
  name: "Triage Tracker"
  description: "Triage Tracker Slack app (dev)"
  background_color: "#ffffff"

features:
  bot_user:
    display_name: "Triage Tracker Bot"
    always_online: false


oauth_config:
  scopes:
    bot:
      - channels:read
      - chat:write
      - im:history
      - users:read
      - channels:manage
      - groups:read
      - commands
      - incoming-webhook
      - app_mentions:read

settings:
  event_subscriptions:
    request_url: "https://caperingly-equiangular-maurine.ngrok-free.dev/api/integrations/slack/events"
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
    request_url: "https://caperingly-equiangular-maurine.ngrok-free.dev/api/integrations/slack/interactions"
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
