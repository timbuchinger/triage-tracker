services:
  # ---------------------------------------
  # PostgreSQL
  # ---------------------------------------
  postgres:
    image: postgres:16
    container_name: triage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage_password
      POSTGRES_DB: triage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: on-failure
    ports:
      - "8080:8080"

  # ---------------------------------------
  # Redis for BullMQ
  # ---------------------------------------
  redis:
    image: redis:7
    container_name: triage-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------
  # RedisInsight GUI for BullMQ queue exploration
  # Runs at http://localhost:5540
  # ---------------------------------------
  redisinsight:
    image: redis/redisinsight:2.70.1
    container_name: triage-redisinsight
    restart: on-failure
    ports:
      - "5540:5540"
    depends_on:
      - redis
    environment:
      RI_APP_PROXY_ENABLE: "false"
    volumes:
      - redisinsight_data:/data

  # ---------------------------------------
  # Backend API (NestJS)
  # ---------------------------------------
  api:
    container_name: triage-api
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_api_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://triage:triage_password@postgres:5432/triage?schema=public
      REDIS_URL: redis://redis:6379
      # Tracing configuration is inherited from the environment (e.g. Honeycomb)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------
  # Worker service (NestJS worker pod)
  # ---------------------------------------
  worker:
    container_name: triage-worker
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev:worker"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_worker_node_modules:/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://triage:triage_password@postgres:5432/triage?schema=public
      REDIS_URL: redis://redis:6379
      # Ensure tracing is enabled in the worker; dependencies will be
      # installed on container start if missing.
      # Tracing configuration is inherited from the environment (e.g. Honeycomb)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------
  # Frontend (Vite dev server)
  # ---------------------------------------
  frontend:
    container_name: triage-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    working_dir: /app
    volumes:
      - ./frontend:/app
      # use host node_modules to keep dev deps in sync
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    depends_on:
      api:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  backend_api_node_modules:
  backend_worker_node_modules:
